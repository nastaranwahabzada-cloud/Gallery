<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری تصاویر</title>
    
</head>
<body>

    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111827;
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 1100px;
}

.gallery {
    display: flex;
    gap: 25px;
    align-items: center;
}



.images-list {
    width: 200px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.images-list h2 {
    margin-bottom: 10px;
    text-align: center;
}

.thumb {
    width: 100%;
    height: 90px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    opacity: 0.5;
    border: 3px solid transparent;
    transition: 0.3s;
}

.thumb:hover {
    opacity: 1;
    transform: scale(1.05);
}

.thumb.active {
    opacity: 1;
    border-color: #38bdf8;
}


.main-content {
    flex: 1;
    position: relative;
    overflow: hidden;
    border-radius: 15px;
    background: #1f2937;
}

.main-content img {
    width: 100%;
    height: 550px;
    object-fit: cover;
    display: block;
    transition: 0.4s;
}

.info {
    padding: 20px;
    background: #1f2937;
}

.info h1 {
    color: #38bdf8;
    margin-bottom: 12px;
}

.info p {
    color: #ddd;
    line-height: 1.8;
}



.animate-imgs {
    animation: zoom 0.4s ease;
}

@keyframes zoom {
    from {
        opacity: 0;
        transform: scale(0.95);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}



@media(max-width: 650px) {

    .gallery {
        flex-direction: column;
    }

    .images-list {
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
    }

    .images-list h2 {
        width: 100%;
    }

    .thumb {
        width: 17%;
        height: 65px;
    }

    .main-content img {
        height: 350px;
    }
}

    </style>

    <div class="container">

        <div class="gallery">

            <div class="images-list">
                <h2>گالری تصاویر</h2>

                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=300"
                class="thumb active" alt="تصویر اول">

                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=300"
                class="thumb" alt="تصویر دوم">

                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=300"
                class="thumb" alt="تصویر سوم">

                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=300"
                class="thumb" alt="تصویر چهارم">

                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=300"
                class="thumb" alt="تصویر پنجم">

            </div>

            
            <div class="main-content">

                <img id="currentImage"
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1000"
                alt="تصویر اصلی">

                <div class="info">
                    <h1 id="titleImage">طبیعت زیبا</h1>
                    <p id="descImage">
                        منظره‌ای زیبا از طبیعت و کوهستان.
                    </p>
                </div>

            </div>

        </div>

    </div>




    <script>

const imgs = document.querySelectorAll(".thumb");

const currentImage = document.querySelector("#currentImage");

const titleImage = document.querySelector("#titleImage");

const descImage = document.querySelector("#descImage");


const places = [
    {
        name: "طبیعت زیبا",
        description: "منظره‌ای زیبا از طبیعت و کوهستان.",
        src: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1000"
    },

    {
        name: "جنگل سرسبز",
        description: "درختان زیبا و طبیعت سرسبز.",
        src: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000"
    },

    {
        name: "طلوع خورشید",
        description: "طلوع زیبای خورشید در طبیعت.",
        src: "https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1000"
    },

    {
        name: "دریاچه کوهستان",
        description: "آب‌های آرام در میان کوهستان.",
        src: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1000"
    },

    {
        name: "جنگل آرام",
        description: "جنگلی زیبا با درختان بلند.",
        src: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1000"
    }
];




imgs.forEach((image, index) => {

    image.addEventListener("click", function() {

        currentImage.src = places[index].src;

        titleImage.innerText = places[index].name;

        descImage.innerText = places[index].description;

        imgs.forEach(img => {
            img.classList.remove("active");
        });

      
        image.classList.add("active");

      
        currentImage.classList.remove("animate-imgs");

        void currentImage.offsetWidth;

        currentImage.classList.add("animate-imgs");

        setTimeout(function() {

            currentImage.classList.remove("animate-imgs");

        }, 400);

    });

});

    </script>
</body>
</html>
